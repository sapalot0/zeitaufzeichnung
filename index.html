<style>
  :root{
    --paper:#EEF2EF;
    --surface:#FFFFFF;
    --surface-alt:#E3E9E5;
    --ink:#17231F;
    --ink-soft:#5B6B64;
    --line:#C7D1CB;
    --accent:#A3752E;
    --accent-ink:#6B4A17;
    --accent-soft:#F1E4C9;
    --ok:#2E6F52;
    --ok-soft:#DCEEE3;
    --danger:#A23A33;
    --danger-soft:#F4DFDC;
    --shadow: 0 1px 2px rgba(23,35,31,.06), 0 6px 16px rgba(23,35,31,.05);
    --radius: 3px;
    --font-ui: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-num: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#14191A;
      --surface:#1C2325;
      --surface-alt:#232B2C;
      --ink:#E6ECE8;
      --ink-soft:#98A6A0;
      --line:#33403F;
      --accent:#D8A75C;
      --accent-ink:#F2DDAF;
      --accent-soft:#372C19;
      --ok:#68BA93;
      --ok-soft:#1D332A;
      --danger:#E3897F;
      --danger-soft:#3A2320;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --paper:#14191A;
    --surface:#1C2325;
    --surface-alt:#232B2C;
    --ink:#E6ECE8;
    --ink-soft:#98A6A0;
    --line:#33403F;
    --accent:#D8A75C;
    --accent-ink:#F2DDAF;
    --accent-soft:#372C19;
    --ok:#68BA93;
    --ok-soft:#1D332A;
    --danger:#E3897F;
    --danger-soft:#3A2320;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
  }

  /* ---- Farbschemata (Akzentfarbe) — "Messing" ist die Vorgabe und lebt in :root oben ---- */
  :root[data-scheme="salbei"]{ --accent:#3F7355; --accent-ink:#24503A; --accent-soft:#DCEBDF; }
  @media (prefers-color-scheme: dark){
    :root[data-scheme="salbei"]:not([data-theme="light"]){ --accent:#7FC79A; --accent-ink:#CFF0DD; --accent-soft:#1E3327; }
  }
  :root[data-scheme="salbei"][data-theme="dark"]{ --accent:#7FC79A; --accent-ink:#CFF0DD; --accent-soft:#1E3327; }

  :root[data-scheme="indigo"]{ --accent:#3E5FA3; --accent-ink:#253C6B; --accent-soft:#DEE6F7; }
  @media (prefers-color-scheme: dark){
    :root[data-scheme="indigo"]:not([data-theme="light"]){ --accent:#8FB0F5; --accent-ink:#DCE7FC; --accent-soft:#1E2C4A; }
  }
  :root[data-scheme="indigo"][data-theme="dark"]{ --accent:#8FB0F5; --accent-ink:#DCE7FC; --accent-soft:#1E2C4A; }

  :root[data-scheme="bordeaux"]{ --accent:#96354A; --accent-ink:#672437; --accent-soft:#F4DEE3; }
  @media (prefers-color-scheme: dark){
    :root[data-scheme="bordeaux"]:not([data-theme="light"]){ --accent:#E2919F; --accent-ink:#FAE0E4; --accent-soft:#3B1E24; }
  }
  :root[data-scheme="bordeaux"][data-theme="dark"]{ --accent:#E2919F; --accent-ink:#FAE0E4; --accent-soft:#3B1E24; }

  :root[data-scheme="graphit"]{ --accent:#454F4A; --accent-ink:#262F2A; --accent-soft:#E3E7E4; }
  @media (prefers-color-scheme: dark){
    :root[data-scheme="graphit"]:not([data-theme="light"]){ --accent:#C3CBC6; --accent-ink:#EEF1EF; --accent-soft:#333B36; }
  }
  :root[data-scheme="graphit"][data-theme="dark"]{ --accent:#C3CBC6; --accent-ink:#EEF1EF; --accent-soft:#333B36; }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-ui);
    font-size:14px;
    line-height:1.5;
    min-height:100vh;
  }
  ::selection{background:var(--accent-soft);}
  button{font-family:inherit;}
  input,select{font-family:inherit;}

  .shell{display:flex;min-height:100vh;}

  /* ---- Sidebar ---- */
  .side{
    width:216px;
    flex:none;
    border-right:1px solid var(--line);
    padding:22px 14px;
    display:flex;
    flex-direction:column;
    gap:26px;
  }
  .brand{padding:0 8px;display:flex;align-items:center;gap:12px;}
  .brand-logo{
    width:46px;height:46px;flex:none;
    border-radius:50%;
    box-shadow:0 0 0 1px var(--line);
    overflow:hidden;
  }
  .brand-logo img{width:100%;height:100%;display:block;object-fit:cover;}
  .brand-text{min-width:0;}
  .brand-mark{
    font-family:var(--font-num);
    font-size:11px;
    letter-spacing:.06em;
    color:var(--accent-ink);
    background:var(--accent-soft);
    display:inline-block;
    padding:2px 6px;
    border-radius:2px;
    margin-bottom:6px;
  }
  .brand h1{
    font-size:18px;
    margin:0;
    font-weight:600;
    letter-spacing:-.01em;
  }
  .brand p{margin:2px 0 0;font-size:11.5px;color:var(--ink-soft);}

  nav{display:flex;flex-direction:column;gap:2px;}
  .navlink{
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 10px;
    border-radius:var(--radius);
    color:var(--ink-soft);
    cursor:pointer;
    border-left:2px solid transparent;
    font-size:13.5px;
    transition:background .12s ease, color .12s ease;
  }
  .navlink:hover{background:var(--surface-alt);color:var(--ink);}
  .navlink.active{
    color:var(--ink);
    background:var(--surface-alt);
    border-left:2px solid var(--accent);
    font-weight:600;
  }
  .navlink .n{
    font-family:var(--font-num);
    font-size:11px;
    color:var(--ink-soft);
    width:16px;
  }

  .side-foot{margin-top:auto;font-size:11px;color:var(--ink-soft);padding:0 8px;}

  /* ---- Main ---- */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding:18px 30px;
    border-bottom:1px solid var(--line);
    background:var(--surface);
  }
  .topbar h2{margin:0;font-size:16px;font-weight:600;}
  .topbar .sub{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .empselect{display:flex;align-items:center;gap:8px;}
  .empselect label{font-size:12px;color:var(--ink-soft);}

  .content{padding:26px 30px 60px;max-width:980px;}
  .content.center{display:flex;align-items:center;justify-content:center;min-height:92vh;max-width:none;padding:20px;}
  .authcard{max-width:440px;width:100%;}
  .authcard .btn{width:100%;justify-content:center;}
  .authcard-logo{width:72px;height:72px;border-radius:50%;margin:0 auto 16px;display:block;box-shadow:0 0 0 1px var(--line);}

  /* ---- Form controls ---- */
  select, input[type=text], input[type=date], input[type=month], input[type=time], input[type=number]{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:7px 9px;
    color:var(--ink);
    font-size:13.5px;
  }
  input[type=time], input[type=number]{font-family:var(--font-num);}
  select:focus, input:focus{outline:2px solid var(--accent);outline-offset:1px;}

  .btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--ink);
    color:var(--paper);
    border:none;
    border-radius:var(--radius);
    padding:8px 14px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  .btn:hover{opacity:.88;}
  .btn.secondary{background:var(--surface);color:var(--ink);border:1px solid var(--line);}
  .btn.accent{background:var(--accent);color:#241a08;}
  .btn.danger{background:var(--danger-soft);color:var(--danger);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn.small{padding:5px 10px;font-size:12px;}
  .linkbtn{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:12px;padding:2px 4px;text-decoration:underline;text-underline-offset:2px;}

  .swatch-row{display:flex;flex-wrap:wrap;gap:12px;}
  .swatch-btn{
    display:flex;flex-direction:column;align-items:center;gap:6px;
    background:none;border:none;cursor:pointer;padding:4px;font-family:inherit;
  }
  .swatch-dot{
    width:34px;height:34px;border-radius:50%;
    border:2px solid var(--surface);
    box-shadow:0 0 0 1px var(--line);
  }
  .swatch-btn.active .swatch-dot{ box-shadow:0 0 0 2px var(--accent); }
  .swatch-btn span{font-size:11.5px;color:var(--ink-soft);}
  .swatch-btn.active span{color:var(--ink);font-weight:600;}
  .linkbtn:hover{color:var(--danger);}

  /* ---- Card / table ---- */
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:6px;
    box-shadow:var(--shadow);
    padding:20px 22px;
    margin-bottom:20px;
  }
  .card h3{margin:0 0 4px;font-size:14px;font-weight:600;}
  .card .hint{font-size:12px;color:var(--ink-soft);margin:0 0 14px;}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;}
  .field{display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:11.5px;color:var(--ink-soft);}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{
    text-align:left;
    font-size:11px;
    text-transform:none;
    color:var(--ink-soft);
    font-weight:600;
    padding:8px 10px;
    border-bottom:1px solid var(--line);
  }
  td{padding:8px 10px;border-bottom:1px solid var(--line);}
  tr:last-child td{border-bottom:none;}
  td.num, th.num{font-family:var(--font-num);text-align:right;}
  tr.total td{font-weight:700;border-top:1px solid var(--ink);border-bottom:none;}
  tr.weekend td{background:var(--surface-alt);}
  tr.today td{background:var(--accent-soft);}

  .pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;}
  .pill.ok{background:var(--ok-soft);color:var(--ok);}
  .pill.bad{background:var(--danger-soft);color:var(--danger);}
  .pill.neutral{background:var(--surface-alt);color:var(--ink-soft);}

  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px;}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px 18px;box-shadow:var(--shadow);}
  .stat .label{font-size:11.5px;color:var(--ink-soft);margin-bottom:6px;}
  .stat .value{font-family:var(--font-num);font-size:24px;font-weight:600;letter-spacing:-.01em;}
  .stat .value.ok{color:var(--ok);}
  .stat .value.bad{color:var(--danger);}

  .empty{
    border:1px dashed var(--line);
    border-radius:6px;
    padding:34px 20px;
    text-align:center;
    color:var(--ink-soft);
    font-size:13px;
  }

  .weekbar{display:flex;align-items:center;gap:14px;margin-bottom:16px;}
  .weekbar .lbl{font-family:var(--font-num);font-size:13px;color:var(--ink-soft);}

  .toast{
    position:fixed;bottom:20px;right:20px;
    background:var(--ink);color:var(--paper);
    padding:10px 16px;border-radius:var(--radius);
    font-size:13px;box-shadow:var(--shadow);
    opacity:0;transform:translateY(6px);
    transition:opacity .18s ease, transform .18s ease;
    pointer-events:none;
    z-index:50;
  }
  .toast.show{opacity:1;transform:translateY(0);}

  .print-head{display:none;}

  @media (max-width: 760px){
    .shell{flex-direction:column;}
    .side{
      width:100%;flex-direction:row;align-items:center;flex-wrap:wrap;
      padding:12px 14px;gap:10px;border-right:none;border-bottom:1px solid var(--line);
    }
    .brand{padding:0;}
    .side-foot{display:none;}
    nav{flex-direction:row;flex-wrap:wrap;}
    .content{padding:18px 16px 50px;}
    .topbar{padding:14px 16px;flex-wrap:wrap;}
    .stat-grid{grid-template-columns:1fr;}
    table{display:block;overflow-x:auto;white-space:nowrap;}
  }

  @media print{
    body *{visibility:hidden;}
    .printable, .printable *{visibility:visible;}
    .printable{position:absolute;top:0;left:0;width:100%;padding:0;margin:0;}
    .print-head{display:block;margin-bottom:18px;display:flex;align-items:center;gap:14px;}
    .print-head img{width:44px;height:44px;border-radius:50%;flex:none;}
    .print-head h1{font-size:18px;margin:0 0 2px;}
    .print-head .meta{font-size:12px;color:#444;}
    .sign{margin-top:60px;display:flex;gap:60px;}
    .sign .line{border-top:1px solid #333;padding-top:6px;font-size:11px;color:#444;width:220px;}
  }
</style>

      if(t==='light' || t==='dark') document.documentElement.setAttribute('data-theme', t);
      const s = localStorage.getItem('stundenbuch.colorScheme');
      if(s && s!=='messing') document.documentElement.setAttribute('data-scheme', s);
    }catch(e){}
  })();
</script>

function fmtDate(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function todayMonth(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }
function todayStr(){ return fmtDate(new Date()); }
function parseDate(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function weekdayIdx(dateStr){ const d=parseDate(dateStr); const wd=d.getDay(); return wd===0?6:wd-1; }
function daysInMonth(y,m){ return new Date(y,m,0).getDate(); }
/* Sollstunden werden als Wochenstunden erfasst und gelten für den ganzen Monat gleich.
   Rechnet auf Basis eines Tagessatzes (Wochenstunden/7) auf den vollen Monat hoch. */
function weeklyToMonthly(weeklyHours, y, m){ return (weeklyHours/7) * daysInMonth(y,m); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtHours(h){ return (Math.round((h||0)*100)/100).toFixed(2).replace('.',','); }
function fmtTimeShort(s){ return s || '—'; }

function calcHours(start,end){
  if(!start||!end) return null;
  const [sh,sm]=start.split(':').map(Number);
  const [eh,em]=end.split(':').map(Number);
  const startMin=sh*60+sm;
  let endMin=eh*60+em;
  if(endMin===startMin) return null; // gleiche Uhrzeit: keine sinnvolle Dauer
  if(endMin<startMin) endMin += 24*60; // Endzeit liegt vor der Anfangszeit -> Tageswechsel, Ende zählt für den Folgetag
  return Math.round(((endMin-startMin)/60)*100)/100;
}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(toast._h);
  toast._h=setTimeout(()=>t.classList.remove('show'),2200);
}

function authorityFor(audience, tenantId){
  if(audience==='tenant') return `https://login.microsoftonline.com/${encodeURIComponent(tenantId||'organizations')}`;
  if(audience==='consumers') return 'https://login.microsoftonline.com/consumers';

  return 'https://login.microsoftonline.com/common';
}

/* Erkennt, ob eine MSAL-Anmeldefehlermeldung bedeutet "dieses Konto ist nicht
   freigeschaltet" (z. B. weil in Entra ID "Benutzerzuweisung erforderlich"
   aktiv ist und das Konto nicht zugewiesen wurde), statt eines echten
   Konfigurationsfehlers (falsche Client-ID o. Ä.). */
function isAccessDeniedError(e){
  const s = `${(e&&e.errorCode)||''} ${(e&&e.errorMessage)||''} ${(e&&e.message)||''}`;
  return /AADSTS50105|AADSTS700016|AADSTS65004|access_denied|user_not_assigned/i.test(s);
}

      <h3>Einrichtung</h3>
      <p class="hint">Diese App speichert ihre Daten in Microsoft 365. Dafür braucht sie einmalig eine App-Registrierung (Anleitung: SETUP.md). Trage hier die dabei erzeugte Client-ID ein.</p>
      <div class="field" style="margin-bottom:12px;">
        <label for="setClientId">Client-ID (Anwendungs-ID)</label>
        <input type="text" id="setClientId" placeholder="z. B. 3f8a1c2e-7b41-4a9d-9c2a-…" value="${esc(savedId)}" style="width:100%;">
      </div>
      <div class="field" style="margin-bottom:12px;">
        <label for="setAudience">Kontotyp</label>
        <select id="setAudience" style="width:100%;">
          <option value="tenant">Nur mein Unternehmen (Entra-ID-Tenant, empfohlen)</option>
          <option value="organizations">Jedes Geschäfts-/Schulkonto (Microsoft 365)</option>
          <option value="common">Privat oder geschäftlich (beides)</option>
          <option value="consumers">Privates Microsoft-Konto (Outlook/Live/Hotmail)</option>
        </select>
      </div>
      <div id="tenantField" style="display:none;">
        <div class="field" style="margin-bottom:16px;">
          <label for="setTenantId">Tenant-ID oder Verzeichnisdomäne</label>
          <input type="text" id="setTenantId" placeholder="z. B. firma.onmicrosoft.com oder GUID" value="${esc(savedTenant)}" style="width:100%;">
        </div>
      </div>
      <p class="hint" style="margin-top:-8px;margin-bottom:16px;">Wer sich anmelden darf, wird zusätzlich — und sicherer — in Entra ID selbst festgelegt: „Benutzerzuweisung erforderlich" + Zuweisung der berechtigten Personen (siehe SETUP.md, Abschnitt „Zugriff beschränken"). Die Auswahl hier verhindert nur, dass sich fremde Organisationen überhaupt anmelden können.</p>
      <div class="field" style="margin-bottom:12px;">
        <label for="setStorageMode">Speicherort</label>
        <select id="setStorageMode" style="width:100%;">
          <option value="sharepoint">SharePoint-Bibliothek eines Teams</option>
          <option value="onedrive">Persönliches OneDrive (App-Ordner)</option>
        </select>
      </div>
      <div id="spFields" style="display:none;">
        <div class="field" style="margin-bottom:12px;">
          <label for="setSpSite">SharePoint-Site-URL</label>
          <input type="text" id="setSpSite" placeholder="https://firma.sharepoint.com/sites/Teamname" value="${esc(savedSite)}" style="width:100%;">
        </div>
        <div class="row" style="margin-bottom:16px;">
          <div class="field" style="flex:1;">
            <label for="setSpLibrary">Bibliothek (optional)</label>
            <input type="text" id="setSpLibrary" placeholder="Standard: Dokumente" value="${esc(savedLibrary)}" style="width:100%;">
          </div>
          <div class="field" style="flex:1;">
            <label for="setSpFolder">Ordner in der Bibliothek</label>
            <input type="text" id="setSpFolder" placeholder="z. B. Verwaltung/Zeiterfassung" value="${esc(savedFolder)}" style="width:100%;">
            <p class="hint" style="margin:4px 0 0;">Auch verschachtelte Unterordner möglich, z. B. „Verwaltung/Zeiterfassung" — wird beim ersten Start automatisch angelegt.</p>
          </div>
        </div>
      </div>
      ${msg?`<p class="hint" style="color:var(--danger);">${esc(msg)}</p>`:''}
      <button class="btn accent" id="setSave">Speichern &amp; fortfahren</button>
    </div>
  `;
  const audSel = document.getElementById('setAudience');
  audSel.value = localStorage.getItem(LS_AUDIENCE) || 'tenant';
  const tenantField = document.getElementById('tenantField');
  tenantField.style.display = audSel.value==='tenant' ? '' : 'none';
  audSel.addEventListener('change', ()=>{ tenantField.style.display = audSel.value==='tenant' ? '' : 'none'; });
  const modeSel = document.getElementById('setStorageMode');
  modeSel.value = savedMode;
  const spFields = document.getElementById('spFields');
  spFields.style.display = savedMode==='sharepoint' ? '' : 'none';
  modeSel.addEventListener('change', ()=>{ spFields.style.display = modeSel.value==='sharepoint' ? '' : 'none'; });
  document.getElementById('setSave').addEventListener('click', ()=>{
    const id = document.getElementById('setClientId').value.trim();
    const aud = document.getElementById('setAudience').value;
    const mode = document.getElementById('setStorageMode').value;
    if(!id){ toast('Bitte die Client-ID eintragen.'); return; }
    if(aud==='tenant'){
      const tenantId = document.getElementById('setTenantId').value.trim();
      if(!tenantId){ toast('Bitte die Tenant-ID oder Verzeichnisdomäne eintragen.'); return; }
      localStorage.setItem(LS_TENANT_ID, tenantId);
    }
    if(mode==='sharepoint'){
      const site = document.getElementById('setSpSite').value.trim();
      if(!site){ toast('Bitte die SharePoint-Site-URL eintragen.'); return; }
      try{ new URL(site); }catch(e){ toast('Das ist keine gültige URL.'); return; }
      localStorage.setItem(LS_SP_SITE, site);
      localStorage.setItem(LS_SP_LIBRARY, document.getElementById('setSpLibrary').value.trim());
      localStorage.setItem(LS_SP_FOLDER, document.getElementById('setSpFolder').value.trim());
    }
    localStorage.setItem(LS_CLIENT_ID, id);
    localStorage.setItem(LS_AUDIENCE, aud);
    localStorage.setItem(LS_STORAGE_MODE, mode);
    localStorage.removeItem(LS_SKIP_DEFAULTS);
    location.reload();
  });
}

function renderSigninScreen(){
  showShell(false);
  const c = document.getElementById('content');
  c.className = 'content center';

function resetConfig(){
  [LS_CLIENT_ID, LS_AUDIENCE, LS_TENANT_ID, LS_STORAGE_MODE, LS_SP_SITE, LS_SP_LIBRARY, LS_SP_FOLDER].forEach(k=>localStorage.removeItem(k));
  localStorage.setItem(LS_SKIP_DEFAULTS, '1');
}

async function signOut(){
  try{ await msalInstance.logoutRedirect({ account }); }catch(e){ location.reload(); }
}

async function ensureToken(){
  const req = { scopes: GRAPH_SCOPES, account };
  try{
    const res = await msalInstance.acquireTokenSilent(req);
    return res.accessToken;
  }catch(e){
    await msalInstance.acquireTokenRedirect(req); // Seite navigiert weg, kein Rückgabewert nötig
    return null;
  }
}

async function graphFetch(path, options){
  const token = await ensureToken();
  if(!token) return null; // interaktive Anmeldung läuft, Seite navigiert weg
  const res = await fetch(`https://graph.microsoft.com/v1.0${path}`, {
    ...(options||{}),
    headers: { ...((options&&options.headers)||{}), Authorization: `Bearer ${token}` },
  });
  return res;
}

function encodeGraphSegment(s){ return encodeURIComponent(s).replace(/%20/g,' '); }
function encodeGraphPath(path){ return path.split('/').map(s=>s.trim()).filter(Boolean).map(encodeGraphSegment).join('/'); }

/* Stellt sicher, dass ein (ggf. mehrstufiger) Ordnerpfad wie "Verwaltung/Zeiterfassung"
   in der Bibliothek existiert, und legt fehlende Zwischenordner automatisch an. */
async function ensureFolderPath(driveId, path){
  const segments = path.split('/').map(s=>s.trim()).filter(Boolean);
  let currentPath = '';
  for(const seg of segments){
    const parentPath = currentPath;
    currentPath = currentPath ? `${currentPath}/${seg}` : seg;
    const checkRes = await graphFetch(`/drives/${driveId}/root:/${encodeGraphPath(currentPath)}`);
    if(!checkRes) return false;
    if(checkRes.status===404){
      const childrenUrl = parentPath
        ? `/drives/${driveId}/root:/${encodeGraphPath(parentPath)}:/children`
        : `/drives/${driveId}/root/children`;
      const createRes = await graphFetch(childrenUrl, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ name: seg, folder:{}, '@microsoft.graph.conflictBehavior':'fail' }),
      });
      if(!createRes) return false;
      if(!createRes.ok && createRes.status!==409){
        throw new Error(`Der Ordner „${seg}" konnte nicht angelegt werden. Prüfe, ob das Konto Schreibrechte auf der Bibliothek hat.`);
      }
    } else if(!checkRes.ok){
      throw new Error(`Zugriff auf den Ordner „${currentPath}" fehlgeschlagen (HTTP ${checkRes.status}).`);
    }
  }
  return true;
}

/* Löst den Speicherort auf: persönlicher OneDrive-App-Ordner oder eine SharePoint-Team-Bibliothek.
   Setzt die globale Variable dataFileGraphPath, die alle Lese-/Schreibzugriffe verwenden. */
async function resolveStorageTarget(){
  const mode = localStorage.getItem(LS_STORAGE_MODE) || 'sharepoint';
  if(mode!=='sharepoint'){
    dataFileGraphPath = `/me/drive/special/approot:/${DATA_FILE_PATH}`;
    return true;
  }

  const siteUrl = (localStorage.getItem(LS_SP_SITE) || '').trim();
  const libraryName = (localStorage.getItem(LS_SP_LIBRARY) || '').trim();
  const folderName = (localStorage.getItem(LS_SP_FOLDER) || '').trim();

  let u;
  try{ u = new URL(siteUrl); }catch(e){ throw new Error('Die hinterlegte SharePoint-Site-URL ist ungültig. Bitte in den Einstellungen korrigieren.'); }
  const relPath = u.pathname.replace(/\/$/,'');

  const siteRes = await graphFetch(`/sites/${u.hostname}:${relPath}`);
  if(!siteRes) return false;
  if(!siteRes.ok) throw new Error(`Die SharePoint-Site wurde nicht gefunden (HTTP ${siteRes.status}). Bitte die Site-URL und die Kontoberechtigung prüfen.`);
  const site = await siteRes.json();

  let driveId;
  if(libraryName){
    const drivesRes = await graphFetch(`/sites/${site.id}/drives`);
    if(!drivesRes) return false;
    if(!drivesRes.ok) throw new Error('Die Bibliotheken dieser Site konnten nicht geladen werden.');
    const drives = (await drivesRes.json()).value || [];
    const match = drives.find(d=> (d.name||'').toLowerCase()===libraryName.toLowerCase());
    if(!match) throw new Error(`Die Bibliothek „${libraryName}" wurde auf dieser Site nicht gefunden.`);
    driveId = match.id;
  } else {
    const driveRes = await graphFetch(`/sites/${site.id}/drive`);
    if(!driveRes) return false;
    if(!driveRes.ok) throw new Error('Die Standard-Dokumentbibliothek dieser Site konnte nicht geladen werden.');
    driveId = (await driveRes.json()).id;
  }

  if(folderName){
    const ok = await ensureFolderPath(driveId, folderName);
    if(!ok) return false;
    dataFileGraphPath = `/drives/${driveId}/root:/${encodeGraphPath(folderName)}/${DATA_FILE_PATH}`;
  } else {
    dataFileGraphPath = `/drives/${driveId}/root:/${DATA_FILE_PATH}`;
  }
  return true;
}

async function loadStoreFromOneDrive(){
  const res = await graphFetch(`${dataFileGraphPath}:/content`);
  if(!res) return false; // Weiterleitung zur Anmeldung läuft
  if(res.status===404){ store = { employees: [], targets: [], entries: [] }; return true; }
  if(!res.ok) throw new Error(`Zugriff auf die gespeicherten Daten fehlgeschlagen (HTTP ${res.status}). Bitte Berechtigungen der App-Registrierung prüfen.`);
  const data = await res.json();
  store = {
    employees: Array.isArray(data.employees)?data.employees:[],
    targets: Array.isArray(data.targets)?data.targets:[],
    entries: Array.isArray(data.entries)?data.entries:[],
  };
  return true;
}

let writeChain = Promise.resolve();
function persistStore(){
  writeChain = writeChain.then(async ()=>{
    const res = await graphFetch(`${dataFileGraphPath}:/content`, {
      method: 'PUT',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(store),
    });
    if(res && !res.ok) throw new Error(`Speichern auf OneDrive fehlgeschlagen (HTTP ${res.status}).`);
  }).catch(e=>{ toast(e.message || 'Speichern auf OneDrive fehlgeschlagen.'); throw e; });
  return writeChain;
}

/* db-Schnittstelle wie zuvor, jetzt hinter Microsoft Graph statt eigenem Server */
const COLLECTIONS = ['employees','targets','entries'];
const listeners = { employees: [], targets: [], entries: [] };

function notify(name){ listeners[name].forEach(fn=>fn(store[name])); }
function notifyAll(){ COLLECTIONS.forEach(notify); }
function upsert(name, doc){
  const list = store[name];
  const idx = list.findIndex(d=>d.id===doc.id);
  if(idx>=0) list[idx] = { ...list[idx], ...doc }; else list.push(doc);
}

function makeOneDriveDb(){
  return {
    collection(name){
      return {
        onSnapshot(next){
          listeners[name].push(next);
          next(store[name]);
          return ()=>{ listeners[name] = listeners[name].filter(fn=>fn!==next); };
        },
        doc(id){
          return {
            id,
            async set(data){ upsert(name, {...data, id}); await persistStore(); notify(name); },
            async update(data){ upsert(name, {...data, id}); await persistStore(); notify(name); },
            async delete(){
              store[name] = store[name].filter(d=>d.id!==id);
              if(name==='employees'){
                store.targets = store.targets.filter(t=>t.employeeId!==id);
                store.entries = store.entries.filter(e=>e.employeeId!==id);
              }
              await persistStore();
              notifyAll();
            },
          };
        },
        async add(data){
          const id = crypto.randomUUID();
          store[name].push({ ...data, id });
          await persistStore();
          notify(name);
          return { id };
        },
      };
    },
  };
}

    if(redirectResult && redirectResult.account){ account = redirectResult.account; }
  }catch(e){
    if(isAccessDeniedError(e)){ renderAccessDenied(); return; }
    renderSetupScreen('Anmeldung fehlgeschlagen: ' + (e.errorMessage||e.message) + ' Bitte Client-ID, Kontotyp und Tenant-ID prüfen.');
    return;
  }

  if(!account){
    const accounts = msalInstance.getAllAccounts();
    if(accounts.length) account = accounts[0];
  }
  if(!account){ renderSigninScreen(); return; }
  msalInstance.setActiveAccount(account);

  db = makeOneDriveDb();

  try{
    const targetOk = await resolveStorageTarget();
    if(!targetOk) return; // Weiterleitung zur Anmeldung läuft
    const ok = await loadStoreFromOneDrive();
    if(!ok) return; // Weiterleitung zur Anmeldung läuft
  }catch(e){
    renderLoadError(e.message);
    return;
  }

  document.getElementById('content').className = 'content';
  showShell(true);
  renderSideFoot();

  db.collection('employees').onSnapshot(arr=>{
    employees = arr.slice().sort((a,b)=> (a.name||'').localeCompare(b.name||'','de'));
    if(!currentEmployeeId && employees.length){ currentEmployeeId = employees[0].id; }
    if(currentEmployeeId && !employees.find(e=>e.id===currentEmployeeId)){ currentEmployeeId = employees.length?employees[0].id:null; }
    render();
  });
  db.collection('targets').onSnapshot(arr=>{ targets = arr; render(); });
  db.collection('entries').onSnapshot(arr=>{ entries = arr; render(); });

  render();
})();

/* ------------------------------ render ------------------------------ */
function render(){
  if(!db) return;
  renderNav();
  renderEmpSelect();
  const map = {
    mitarbeiter: renderMitarbeiter,
    sollstunden: renderSollstunden,
    zeiterfassung: renderZeiterfassung,
    monat: renderMonat,
    jahr: renderJahr,
    gesamt: renderGesamt,
    einstellungen: renderEinstellungen,
  };

    mitarbeiter: ['Mitarbeiter','Stammdaten anlegen und pflegen'],
    sollstunden: ['Sollstunden','Wöchentliche Soll-Arbeitsstunden je Mitarbeiter'],
    zeiterfassung: ['Zeiterfassung','Geleistete Stunden je Kalenderwoche erfassen'],
    monat: ['Monatsübersicht','Alle Tage eines Monats, druckbar zur Bestätigung'],

    gesamt: ['Alle Mitarbeiter','Salden aller Mitarbeiter zu einem Stichtag, druckbar'],

  };
  document.getElementById('topTitle').textContent = titles[currentTab][0];

}

function renderNav(){
  const nav=document.getElementById('nav');
  nav.innerHTML = TABS.map(t=>`
    <div class="navlink ${t.id===currentTab?'active':''}" data-tab="${t.id}">
      <span class="n">${t.n}</span><span>${t.label}</span>
    </div>`).join('');
  nav.querySelectorAll('.navlink').forEach(el=>{
    el.addEventListener('click', ()=>{ currentTab = el.dataset.tab; render(); });
  });
}

function renderEmpSelect(){
  const wrap=document.getElementById('empSelectWrap');
  if(currentTab==='mitarbeiter' || currentTab==='gesamt' || currentTab==='einstellungen' || currentTab==='sollstunden'){ wrap.innerHTML=''; return; }

/* ============================ Tab: Mitarbeiter ============================ */
function renderMitarbeiter(){
  const c = document.getElementById('content');
  const editing = editingEmployeeId ? employees.find(e=>e.id===editingEmployeeId) : null;

  c.innerHTML = `
    <div class="card">
      <h3>${editing?'Mitarbeiter bearbeiten':'Neuer Mitarbeiter'}</h3>
      <p class="hint">Name sowie Start- und ggf. Enddatum des Arbeitsverhältnisses.</p>
      <div class="row">
        <div class="field">
          <label for="fName">Name</label>
          <input type="text" id="fName" placeholder="Vor- und Nachname" value="${editing?esc(editing.name):''}">
        </div>
        <div class="field">
          <label for="fStart">Eintrittsdatum</label>
          <input type="date" id="fStart" value="${editing?editing.startDate||'':''}">
        </div>
        <div class="field">
          <label for="fEnd">Austrittsdatum (optional)</label>
          <input type="date" id="fEnd" value="${editing&&editing.endDate?editing.endDate:''}">
        </div>
        <div class="field">
          <button class="btn accent" id="saveEmp">${editing?'Speichern':'Anlegen'}</button>
        </div>
        ${editing?'<div class="field"><button class="btn secondary" id="cancelEditEmp">Abbrechen</button></div>':''}
      </div>
    </div>

    <div class="card">
      <h3>Alle Mitarbeiter</h3>
      ${employees.length? renderEmployeeTable() : `<div class="empty">Noch keine Mitarbeiter angelegt.</div>`}
    </div>
  `;

  document.getElementById('saveEmp').addEventListener('click', async ()=>{
    const name = document.getElementById('fName').value.trim();
    const start = document.getElementById('fStart').value;
    const end = document.getElementById('fEnd').value;
    if(!name){ toast('Bitte einen Namen angeben.'); return; }
    if(!start){ toast('Bitte ein Eintrittsdatum angeben.'); return; }
    if(end && end < start){ toast('Austrittsdatum liegt vor dem Eintrittsdatum.'); return; }
    const payload = { name, startDate: start, endDate: end || null };
    try{
      if(editing){
        await db.collection('employees').doc(editing.id).update(payload);
        toast('Mitarbeiter aktualisiert.');
        editingEmployeeId = null;
      }else{
        const ref = await db.collection('employees').add(payload);
        currentEmployeeId = ref.id;
        toast('Mitarbeiter angelegt.');
      }
    }catch(err){ toast('Speichern fehlgeschlagen.'); }
  });

  const cancelBtn = document.getElementById('cancelEditEmp');
  if(cancelBtn){ cancelBtn.addEventListener('click', ()=>{ editingEmployeeId=null; render(); }); }

  c.querySelectorAll('[data-edit-emp]').forEach(b=>{
    b.addEventListener('click', ()=>{ editingEmployeeId = b.dataset.editEmp; render(); });
  });
  c.querySelectorAll('[data-del-emp]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      const id = b.dataset.delEmp;
      const emp = employees.find(e=>e.id===id);
      if(!confirm(`„${emp?emp.name:''}" wirklich löschen? Alle Sollstunden- und Zeiterfassungsdaten dieses Mitarbeiters werden mitgelöscht.`)) return;
      try{
        await db.collection('employees').doc(id).delete();
        if(currentEmployeeId===id) currentEmployeeId=null;
        toast('Mitarbeiter gelöscht.');
      }catch(err){ toast('Löschen fehlgeschlagen.'); }
    });
  });
}

/* ============================ Tab: Sollstunden ============================ */
let sollstundenMonth = todayMonth();

function renderSollstunden(){
  const c = document.getElementById('content');

  const [my, mm] = sollstundenMonth.split('-').map(Number);
  const monthStart = `${sollstundenMonth}-01`;
  const monthEnd = `${sollstundenMonth}-${String(daysInMonth(my,mm)).padStart(2,'0')}`;
  const activeEmployees = employees.filter(e=>
    (!e.startDate || e.startDate<=monthEnd) && (!e.endDate || e.endDate>=monthStart)
  );

  const rowsHtml = activeEmployees.map(e=>{
    const tdoc = targets.find(t=>t.employeeId===e.id && t.month===sollstundenMonth);
    const val = tdoc ? tdoc.hours : '';
    return `
      <tr data-emp="${e.id}">
        <td>${esc(e.name)}</td>
        <td><input type="number" class="fHoursRow" min="0" step="0.5" style="width:110px;" value="${val}" placeholder="z. B. 40"></td>
        <td class="num monthlyPreview">${tdoc? fmtHours(weeklyToMonthly(tdoc.hours, my, mm))+' h' : '—'}</td>
      </tr>`;
  }).join('');

  c.innerHTML = `
    <div class="card">
      <h3>Wochenstunden festlegen</h3>
      <p class="hint">Die Sollstunden werden als Wochenstunden erfasst und gelten für den ganzen Monat gleich. Zwischen den Monaten kannst du oben umschalten; leere Felder werden nicht gespeichert.</p>
      <div class="field" style="margin-bottom:16px;max-width:220px;">
        <label for="fMonth">Monat</label>
        <input type="month" id="fMonth" value="${sollstundenMonth}">
      </div>
      ${activeEmployees.length? `
      <table>
        <thead><tr><th>Mitarbeiter</th><th>Wochenstunden</th><th class="num">≈ Monatsstunden</th></tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
      <div class="row" style="margin-top:16px;">
        <button class="btn accent" id="saveAllTargets">Speichern</button>
      </div>
      ` : `<div class="empty">Für ${monthLabel(sollstundenMonth)} sind keine aktiven Mitarbeiter vorhanden.</div>`}
    </div>
  `;

  document.getElementById('fMonth').addEventListener('change', e=>{
    if(e.target.value){ sollstundenMonth = e.target.value; render(); }
  });

  // Live-Vorschau der Monatsstunden beim Tippen
  c.querySelectorAll('tbody tr[data-emp]').forEach(tr=>{
    const input = tr.querySelector('.fHoursRow');
    input.addEventListener('input', ()=>{
      const v = Number(input.value);
      const preview = tr.querySelector('.monthlyPreview');
      preview.textContent = (input.value!=='' && !isNaN(v) && v>=0) ? fmtHours(weeklyToMonthly(v, my, mm))+' h' : '—';
    });
  });

  const saveBtn = document.getElementById('saveAllTargets');
  if(saveBtn){
    saveBtn.addEventListener('click', async ()=>{
      const rows = Array.from(c.querySelectorAll('tbody tr[data-emp]'));
      let hadInvalid = false;
      try{
        for(const tr of rows){
          const employeeId = tr.dataset.emp;
          const raw = tr.querySelector('.fHoursRow').value;
          const id = `${employeeId}_${sollstundenMonth}`;
          const existing = targets.find(t=>t.employeeId===employeeId && t.month===sollstundenMonth);
          if(raw===''){
            if(existing){ await db.collection('targets').doc(id).delete(); }
            continue;
          }
          const val = Number(raw);
          if(isNaN(val) || val<0){ hadInvalid = true; continue; }
          await db.collection('targets').doc(id).set({ employeeId, month: sollstundenMonth, hours: val });
        }
        toast(hadInvalid? 'Gespeichert – ungültige Werte wurden übersprungen.' : 'Wochenstunden gespeichert.');
      }catch(err){ toast('Speichern fehlgeschlagen.'); }
    });
  }
}

function getMonday(dateStr){
  const d = parseDate(dateStr);
  const idx = weekdayIdx(dateStr); // 0=Mo
  d.setDate(d.getDate()-idx);
  return d;
}

function renderZeiterfassung(){
  const c = document.getElementById('content');
  if(!currentEmployeeId){ c.innerHTML = `<div class="empty">Bitte zuerst unter „Mitarbeiter" einen Mitarbeiter anlegen und auswählen.</div>`; return; }

  const monday = getMonday(weekAnchor);
  const days = [];
  for(let i=0;i<7;i++){
    const d = new Date(monday); d.setDate(monday.getDate()+i);
    days.push(fmtDate(d));
  }
  const sunday = days[6];
  const wkNum = isoWeekNumber(monday);

  const empEntries = {};
  entries.filter(en=>en.employeeId===currentEmployeeId).forEach(en=>{ empEntries[en.date]=en; });

  let weekTotal = 0;
  days.forEach(d=>{ const en=empEntries[d]; if(en&&en.hours) weekTotal+=en.hours; });

  c.innerHTML = `
    <div class="weekbar no-print">
      <button class="btn secondary small" id="prevWeek">← Vorwoche</button>
      <span class="lbl">KW ${wkNum} · ${formatShort(days[0])} – ${formatShort(days[6])}</span>
      <button class="btn secondary small" id="nextWeek">Folgewoche →</button>
      <input type="date" id="jumpDate" value="${weekAnchor}" style="margin-left:auto;">
    </div>

    <div class="card">
      <h3>Erfasste Tage</h3>
      <p class="hint">Anfangs- und Endzeit pro Tag eintragen. Leere Zeilen gelten als nicht gearbeitet. Liegt die Endzeit vor der Anfangszeit (z. B. 22:00 – 06:00), wird das als Schicht über den Tageswechsel gewertet und die Stunden entsprechend berechnet.</p>
      <table>
        <thead>
          <tr><th>Tag</th><th>Datum</th><th>Von</th><th>Bis</th><th class="num">Stunden</th><th>Bemerkung</th></tr>
        </thead>
        <tbody>
          ${days.map((d,i)=>{
            const en = empEntries[d];
            const isWeekend = i>=5;
            const isToday = d===todayStr();
            return `
            <tr class="${isWeekend?'weekend':''} ${isToday?'today':''}" data-day="${d}">
              <td>${WEEKDAYS[i]}</td>
              <td class="num">${formatShort(d)}</td>
              <td><input type="time" class="tStart" value="${en&&en.start?en.start:''}"></td>
              <td><input type="time" class="tEnd" value="${en&&en.end?en.end:''}"></td>
              <td class="num hoursCell">${en&&en.hours?fmtHours(en.hours):'—'}</td>
              <td><input type="text" class="tNote" placeholder="optional" value="${en&&en.note?esc(en.note):''}" style="width:100%;"></td>
            </tr>`;
          }).join('')}
          <tr class="total"><td colspan="4">Wochensumme</td><td class="num" id="weekTotalCell">${fmtHours(weekTotal)} h</td><td></td></tr>
        </tbody>
      </table>
      <div class="row" style="margin-top:16px;">
        <button class="btn accent" id="saveWeek">Woche speichern</button>
      </div>
    </div>
  `;

  document.getElementById('prevWeek').addEventListener('click', ()=>{
    const d=parseDate(weekAnchor); d.setDate(d.getDate()-7); weekAnchor=fmtDate(d); render();
  });
  document.getElementById('nextWeek').addEventListener('click', ()=>{
    const d=parseDate(weekAnchor); d.setDate(d.getDate()+7); weekAnchor=fmtDate(d); render();
  });
  document.getElementById('jumpDate').addEventListener('change', e=>{
    if(e.target.value){ weekAnchor=e.target.value; render(); }
  });

  // live hour preview per row
  c.querySelectorAll('tbody tr[data-day]').forEach(tr=>{
    const upd = ()=>{
      const s=tr.querySelector('.tStart').value, en=tr.querySelector('.tEnd').value;
      const h=calcHours(s,en);
      tr.querySelector('.hoursCell').textContent = h!=null?fmtHours(h)+' h':(s||en?'ungültig':'—');
      let tot=0;
      c.querySelectorAll('tbody tr[data-day]').forEach(r=>{
        const hh=calcHours(r.querySelector('.tStart').value, r.querySelector('.tEnd').value);
        if(hh) tot+=hh;
      });
      document.getElementById('weekTotalCell').textContent = fmtHours(tot)+' h';
    };
    tr.querySelector('.tStart').addEventListener('input', upd);
    tr.querySelector('.tEnd').addEventListener('input', upd);
  });

  document.getElementById('saveWeek').addEventListener('click', async ()=>{
    const rows = Array.from(c.querySelectorAll('tbody tr[data-day]'));
    let hadInvalid=false;
    try{

        const date = tr.dataset.day;
        const start = tr.querySelector('.tStart').value;
        const end = tr.querySelector('.tEnd').value;
        const note = tr.querySelector('.tNote').value.trim();
        const id = `${currentEmployeeId}_${date}`;

          if(empEntries[date]){ await db.collection('entries').doc(id).delete(); }
          continue;
        }
        const hours = calcHours(start,end);
        if(hours==null){ hadInvalid=true; continue; }
        await db.collection('entries').doc(id).set({ employeeId: currentEmployeeId, date, start, end, hours, note: note||null });
      }
      toast(hadInvalid? 'Gespeichert – ungültige Zeilen (gleiche Anfangs- und Endzeit) wurden übersprungen.' : 'Woche gespeichert.');
    }catch(err){ toast('Speichern fehlgeschlagen.'); }
  });
}

function formatShort(dateStr){
  const d=parseDate(dateStr);
  return `${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}.${d.getFullYear()}`;
}
function isoWeekNumber(monday){
  const d = new Date(Date.UTC(monday.getFullYear(), monday.getMonth(), monday.getDate()));
  const dayNum = (d.getUTCDay()+6)%7;
  d.setUTCDate(d.getUTCDate()-dayNum+3);
  const firstThursday = new Date(Date.UTC(d.getUTCFullYear(),0,4));
  const diff = d - firstThursday;
  return 1 + Math.round(diff/(7*24*3600*1000));
}

function renderMonatEinzeln(c, viewToggle){
  if(!currentEmployeeId){ c.innerHTML = viewToggle + `<div class="empty">Bitte zuerst unter „Mitarbeiter" einen Mitarbeiter anlegen und auswählen.</div>`; return; }

  const emp = currentEmployee();
  const empEntries = entries.filter(en=>en.employeeId===currentEmployeeId && en.date.startsWith(monthPick)).sort((a,b)=>a.date.localeCompare(b.date));
  const total = empEntries.reduce((s,en)=>s+(en.hours||0),0);
  const [mY,mM] = monthPick.split('-').map(Number);
  const targetDoc = targets.find(t=>t.employeeId===currentEmployeeId && t.month===monthPick);
  const soll = targetDoc? weeklyToMonthly(targetDoc.hours, mY, mM) : null;
  const diff = soll!=null? total-soll : null;

  c.innerHTML = viewToggle + `

function renderMonatAlle(c, viewToggle){
  if(!employees.length){ c.innerHTML = viewToggle + `<div class="empty">Noch keine Mitarbeiter angelegt.</div>`; return; }

  const [mY,mM] = monthPick.split('-').map(Number);
  const rows = employees.map(emp=>{
    const empEntries = entries.filter(en=>en.employeeId===emp.id && en.date.startsWith(monthPick));
    const ist = empEntries.reduce((s,en)=>s+(en.hours||0),0);
    const targetDoc = targets.find(t=>t.employeeId===emp.id && t.month===monthPick);
    const soll = targetDoc? weeklyToMonthly(targetDoc.hours, mY, mM) : null;

/* ============================ Tab: Jahresübersicht ============================ */
function renderJahr(){
  const c = document.getElementById('content');
  if(!currentEmployeeId){ c.innerHTML = `<div class="empty">Bitte zuerst unter „Mitarbeiter" einen Mitarbeiter anlegen und auswählen.</div>`; return; }

  const emp = currentEmployee();
  const today = new Date();
  const todayY = today.getFullYear(), todayM = today.getMonth()+1, todayD = today.getDate();
  const isCurrentYear = yearPick===todayY;
  const lastMonth = yearPick>todayY? 0 : (yearPick<todayY? 12 : todayM);

  let rows = [];
  let sollSum=0, istSum=0;
  for(let mo=1; mo<=lastMonth; mo++){
    const key = `${yearPick}-${String(mo).padStart(2,'0')}`;
    const tdoc = targets.find(t=>t.employeeId===currentEmployeeId && t.month===key);
    const fullTarget = tdoc? weeklyToMonthly(tdoc.hours, yearPick, mo) : 0;
    const isCurrentMonth = isCurrentYear && mo===todayM;
    let sollMonth = fullTarget;
    if(isCurrentMonth){
      const dim = daysInMonth(yearPick,mo);
      sollMonth = fullTarget * (todayD/dim);
    }
    const istMonth = entries
      .filter(en=>en.employeeId===currentEmployeeId && en.date.startsWith(key))
      .reduce((s,en)=>s+(en.hours||0),0);
    sollSum += sollMonth;
    istSum += istMonth;
    rows.push({mo, key, soll:sollMonth, sollFull:fullTarget, ist:istMonth, prorated:isCurrentMonth});
  }
  const gut = istSum - sollSum;

  c.innerHTML = `
    <div class="row no-print" style="margin-bottom:18px;">
      <div class="field">
        <label for="yYear">Jahr</label>
        <select id="yYear">
          ${yearOptions()}
        </select>
      </div>
    </div>

    <div class="stat-grid">
      <div class="stat"><div class="label">Sollstunden bis heute</div><div class="value">${fmtHours(sollSum)} h</div></div>
      <div class="stat"><div class="label">Iststunden bis heute</div><div class="value">${fmtHours(istSum)} h</div></div>
      <div class="stat"><div class="label">Gutstunden</div><div class="value ${gut>=0?'ok':'bad'}">${gut>=0?'+':''}${fmtHours(gut)} h</div></div>
    </div>

    <div class="card">
      <h3>${emp?esc(emp.name):''} · ${yearPick}</h3>
      <p class="hint">${isCurrentYear? 'Der laufende Monat wird anteilig nach Kalendertagen bis heute berücksichtigt.' : 'Vollständiges Jahr.'}</p>
      ${lastMonth>0? `
      <table>
        <thead><tr><th>Monat</th><th class="num">Soll</th><th class="num">Ist</th><th class="num">Differenz</th></tr></thead>
        <tbody>
          ${rows.map(r=>{
            const d = r.ist - r.soll;
            return `<tr>
              <td>${MONTHS[r.mo-1]}${r.prorated?' <span class="pill neutral">anteilig</span>':''}</td>
              <td class="num">${fmtHours(r.soll)} h</td>
              <td class="num">${fmtHours(r.ist)} h</td>
              <td class="num"><span class="pill ${d>=0?'ok':'bad'}">${d>=0?'+':''}${fmtHours(d)} h</span></td>
            </tr>`;
          }).join('')}
          <tr class="total"><td>Summe</td><td class="num">${fmtHours(sollSum)} h</td><td class="num">${fmtHours(istSum)} h</td><td class="num">${gut>=0?'+':''}${fmtHours(gut)} h</td></tr>
        </tbody>
      </table>` : `<div class="empty">Für dieses Jahr liegen noch keine Daten vor.</div>`}
    </div>
  `;

  document.getElementById('yYear').addEventListener('change', e=>{
    yearPick = Number(e.target.value); render();
  });
}

/* ============================ Tab: Alle Mitarbeiter (Gesamtübersicht) ============================ */
function computeSaldoForEmployee(empId, stichtagStr){
  const [sy,sm,sd] = stichtagStr.split('-').map(Number);
  let soll=0, ist=0;
  for(let mo=1; mo<sm; mo++){
    const key = `${sy}-${String(mo).padStart(2,'0')}`;
    const tdoc = targets.find(t=>t.employeeId===empId && t.month===key);
    soll += tdoc? weeklyToMonthly(tdoc.hours, sy, mo) : 0;
    ist += entries.filter(en=>en.employeeId===empId && en.date.startsWith(key)).reduce((s,en)=>s+(en.hours||0),0);
  }
  const key = `${sy}-${String(sm).padStart(2,'0')}`;
  const tdoc = targets.find(t=>t.employeeId===empId && t.month===key);
  const fullTarget = tdoc? weeklyToMonthly(tdoc.hours, sy, sm) : 0;
  const dim = daysInMonth(sy,sm);
  soll += fullTarget*(sd/dim);
  ist += entries.filter(en=>en.employeeId===empId && en.date.startsWith(key) && en.date<=stichtagStr).reduce((s,en)=>s+(en.hours||0),0);
  return {soll, ist, saldo: ist-soll};
}

function renderGesamt(){
  const c = document.getElementById('content');
  if(!employees.length){ c.innerHTML = `<div class="empty">Noch keine Mitarbeiter angelegt.</div>`; return; }

  const [sy] = stichtag.split('-').map(Number);
  const rows = employees.map(e=>{
    const r = computeSaldoForEmployee(e.id, stichtag);
    const activeAtStichtag = (!e.endDate || e.endDate>=stichtag) && (!e.startDate || e.startDate<=stichtag);
    return {emp:e, ...r, activeAtStichtag};
  });
  const sollSum = rows.reduce((s,r)=>s+r.soll,0);
  const istSum = rows.reduce((s,r)=>s+r.ist,0);
  const gutSum = istSum - sollSum;

  c.innerHTML = `
    <div class="row no-print" style="margin-bottom:18px;">
      <div class="field">
        <label for="gStichtag">Stichtag</label>
        <input type="date" id="gStichtag" value="${stichtag}">
      </div>
      <div class="field">
        <button class="btn secondary" id="printGesamt">Als PDF drucken</button>
      </div>
    </div>

        <div>
          <h1>Jahresübersicht aller Mitarbeiter</h1>
          <div class="meta">Stichtag: ${formatShort(stichtag)} · Kalenderjahr ${sy} · Erstellt am ${formatShort(todayStr())}</div>
        </div>
      </div>

      <div class="stat-grid">
        <div class="stat"><div class="label">Sollstunden gesamt</div><div class="value">${fmtHours(sollSum)} h</div></div>
        <div class="stat"><div class="label">Iststunden gesamt</div><div class="value">${fmtHours(istSum)} h</div></div>
        <div class="stat"><div class="label">Gutstunden gesamt</div><div class="value ${gutSum>=0?'ok':'bad'}">${gutSum>=0?'+':''}${fmtHours(gutSum)} h</div></div>
      </div>

      <div class="card">
        <h3>Salden je Mitarbeiter</h3>
        <p class="hint">Soll- und Iststunden von Jahresbeginn ${sy} bis zum ${formatShort(stichtag)}, laufender Monat anteilig nach Kalendertagen.</p>
        <table>
          <thead><tr><th>Mitarbeiter</th><th>Status</th><th class="num">Soll</th><th class="num">Ist</th><th class="num">Saldo</th></tr></thead>
          <tbody>
            ${rows.map(r=>`
              <tr>
                <td>${esc(r.emp.name)}</td>
                <td>${r.activeAtStichtag? '<span class="pill ok">aktiv</span>' : `<span class="pill neutral">${r.emp.endDate?'ausgetreten '+formatShort(r.emp.endDate):'noch nicht eingetreten'}</span>`}</td>
                <td class="num">${fmtHours(r.soll)} h</td>
                <td class="num">${fmtHours(r.ist)} h</td>
                <td class="num"><span class="pill ${r.saldo>=0?'ok':'bad'}">${r.saldo>=0?'+':''}${fmtHours(r.saldo)} h</span></td>
              </tr>`).join('')}
            <tr class="total"><td colspan="2">Summe</td><td class="num">${fmtHours(sollSum)} h</td><td class="num">${fmtHours(istSum)} h</td><td class="num">${gutSum>=0?'+':''}${fmtHours(gutSum)} h</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  `;

  document.getElementById('gStichtag').addEventListener('change', e=>{
    if(e.target.value){ stichtag=e.target.value; render(); }
  });
  document.getElementById('printGesamt').addEventListener('click', ()=> window.print());
}

function yearOptions(){
  const now = new Date().getFullYear();
  let opts=[];
  for(let y=now-3;y<=now+1;y++){
    opts.push(`<option value="${y}" ${y===yearPick?'selected':''}>${y}</option>`);
  }
  return opts.join('');
}

/* ============================ Tab: Einstellungen ============================ */
const LS_THEME = 'stundenbuch.theme'; // 'system' | 'light' | 'dark'
const LS_COLOR_SCHEME = 'stundenbuch.colorScheme';
const COLOR_SCHEMES = [
  {id:'messing', label:'Messing', swatch:'#A3752E'},
  {id:'salbei', label:'Salbei', swatch:'#3F7355'},
  {id:'indigo', label:'Indigo', swatch:'#3E5FA3'},
  {id:'bordeaux', label:'Bordeaux', swatch:'#96354A'},
  {id:'graphit', label:'Graphit', swatch:'#454F4A'},
];

function applyTheme(theme){
  if(theme==='light' || theme==='dark') document.documentElement.setAttribute('data-theme', theme);
  else document.documentElement.removeAttribute('data-theme');
}

function applyColorScheme(scheme){
  if(scheme && scheme!=='messing') document.documentElement.setAttribute('data-scheme', scheme);
  else document.documentElement.removeAttribute('data-scheme');
}

function renderEinstellungen(){
  const c = document.getElementById('content');
  const theme = localStorage.getItem(LS_THEME) || 'system';
  const scheme = localStorage.getItem(LS_COLOR_SCHEME) || 'messing';
  const mode = localStorage.getItem(LS_STORAGE_MODE) || 'sharepoint';
  const audience = localStorage.getItem(LS_AUDIENCE) || 'tenant';
  const tenantId = localStorage.getItem(LS_TENANT_ID) || '';
  const spSite = localStorage.getItem(LS_SP_SITE) || '';
  const spLibrary = localStorage.getItem(LS_SP_LIBRARY) || '';
  const spFolder = localStorage.getItem(LS_SP_FOLDER) || 'Stundenbuch';

  const themeBtn = (val, label)=> `<button class="btn ${theme===val?'accent':'secondary'}" data-theme-opt="${val}" style="flex:1;">${label}</button>`;

  c.innerHTML = `
    <div class="card">
      <h3>Darstellung</h3>
      <p class="hint">Legt fest, ob die App im hellen oder dunklen Design angezeigt wird. „System" übernimmt die Einstellung des Geräts.</p>
      <div class="row" style="gap:8px;">
        ${themeBtn('system','System')}
        ${themeBtn('light','Hell')}
        ${themeBtn('dark','Dunkel')}
      </div>
    </div>

    <div class="card">
      <h3>Farbschema</h3>
      <p class="hint">Akzentfarbe der App — wirkt sofort, ohne Neuladen.</p>
      <div class="swatch-row">
        ${COLOR_SCHEMES.map(s=>`
          <button class="swatch-btn ${scheme===s.id?'active':''}" data-scheme-opt="${s.id}">
            <span class="swatch-dot" style="background:${s.swatch};"></span>
            <span>${s.label}</span>
          </button>`).join('')}
      </div>
    </div>

    <div class="card">
      <h3>Speicherort der Daten</h3>
      <p class="hint">Wo Mitarbeiter, Sollstunden und Zeiteinträge gespeichert werden. Nach einer Änderung wird die Seite neu geladen; bei Bedarf fragt Microsoft einmalig erneut nach Zustimmung für den neuen Speicherort.</p>
      <div class="field" style="margin-bottom:12px;">
        <label for="setStorageMode2">Speicherort</label>
        <select id="setStorageMode2" style="width:100%;">
          <option value="sharepoint">SharePoint-Bibliothek eines Teams</option>
          <option value="onedrive">Persönliches OneDrive (App-Ordner)</option>
        </select>
      </div>
      <div id="spFields2" style="display:none;">
        <div class="field" style="margin-bottom:12px;">
          <label for="setSpSite2">SharePoint-Site-URL</label>
          <input type="text" id="setSpSite2" placeholder="https://firma.sharepoint.com/sites/Teamname" value="${esc(spSite)}" style="width:100%;">
        </div>
        <div class="row" style="margin-bottom:12px;">
          <div class="field" style="flex:1;">
            <label for="setSpLibrary2">Bibliothek (optional)</label>
            <input type="text" id="setSpLibrary2" placeholder="Standard: Dokumente" value="${esc(spLibrary)}" style="width:100%;">
          </div>
          <div class="field" style="flex:1;">
            <label for="setSpFolder2">Ordner in der Bibliothek</label>
            <input type="text" id="setSpFolder2" placeholder="z. B. Verwaltung/Zeiterfassung" value="${esc(spFolder)}" style="width:100%;">
            <p class="hint" style="margin:4px 0 0;">Auch verschachtelte Unterordner möglich, z. B. „Verwaltung/Zeiterfassung".</p>
          </div>
        </div>
      </div>
      <button class="btn accent" id="saveStorage">Speichern &amp; neu laden</button>
    </div>

    <div class="card">
      <h3>Anmeldung</h3>
      <p class="hint">Kontotyp: ${audience==='tenant'?`nur das Verzeichnis ${esc(tenantId)}`:audience==='organizations'?'jedes Geschäfts-/Schulkonto':audience==='consumers'?'nur private Microsoft-Konten':'privat oder geschäftlich'}. Um Client-ID, Kontotyp oder Tenant zu ändern, ist eine vollständige Neueinrichtung nötig.</p>
      <div class="row">
        <button class="btn secondary" id="fullResetBtn">Einrichtung zurücksetzen &amp; abmelden</button>
      </div>
    </div>
  `;

  c.querySelectorAll('[data-theme-opt]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const val = btn.dataset.themeOpt;
      localStorage.setItem(LS_THEME, val);
      applyTheme(val);
      renderEinstellungen();
    });
  });

  c.querySelectorAll('[data-scheme-opt]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const val = btn.dataset.schemeOpt;
      localStorage.setItem(LS_COLOR_SCHEME, val);
      applyColorScheme(val);
      renderEinstellungen();
    });
  });

  const modeSel2 = document.getElementById('setStorageMode2');
  modeSel2.value = mode;
  const spFields2 = document.getElementById('spFields2');
  spFields2.style.display = modeSel2.value==='sharepoint' ? '' : 'none';
  modeSel2.addEventListener('change', ()=>{ spFields2.style.display = modeSel2.value==='sharepoint' ? '' : 'none'; });

  document.getElementById('saveStorage').addEventListener('click', ()=>{
    const newMode = modeSel2.value;
    if(newMode==='sharepoint'){
      const site = document.getElementById('setSpSite2').value.trim();
      if(!site){ toast('Bitte die SharePoint-Site-URL eintragen.'); return; }
      try{ new URL(site); }catch(e){ toast('Das ist keine gültige URL.'); return; }
      localStorage.setItem(LS_SP_SITE, site);
      localStorage.setItem(LS_SP_LIBRARY, document.getElementById('setSpLibrary2').value.trim());
      localStorage.setItem(LS_SP_FOLDER, document.getElementById('setSpFolder2').value.trim());
    }
    localStorage.setItem(LS_STORAGE_MODE, newMode);
    location.reload();
  });

  document.getElementById('fullResetBtn').addEventListener('click', ()=>{
    if(!confirm('Einrichtung wirklich zurücksetzen? Client-ID, Kontotyp und Speicherort-Einstellungen werden gelöscht und du wirst abgemeldet.')) return;
    resetConfig();
    signOut();
  });
}
</script>
</body>
</html>
